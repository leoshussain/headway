services:
  app:
    build:
      context: .
    init: true
    volumes:
      - .:/app
    # Keep the development container available for `docker compose exec`.
    command: ["sleep", "infinity"]

  collector:
    build:
      context: .
    profiles: ["collection"]
    init: true
    volumes:
      - .:/app:ro
      - ./data:/app/data
    command: ["headway-collect"]
    restart: unless-stopped
    logging:
      options:
        max-size: "10m"
        max-file: "3"
